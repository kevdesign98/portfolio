<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gateway | Portfolio</title>
    <meta name="description"
        content="Il portfolio di Kevin Cooray, Front-end Developer & Designer basato a Pistoia, Italia. Scopri i miei lavori e progetti di visual design.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Manrope:wght@200..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.style.css">
</head>


<body>

    <div id="loader-wrapper">
        <div class="loader-content">
            <h2 id="progress-text" class="text-center">0%</h2>
            <div class="progress-bar-bg">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>


    <main
        class="container-fluid min-vh-100 d-flex flex-column align-items-center justify-content-center py-5 position-relative overflow-x-hidden">
        <header
            class="header-container d-flex justify-content-between align-items-center px-4 px-md-5 py-3 py-md-4 w-100 position-absolute top-0 start-0">
            <div class="header-location">
                <p class="text-uppercase m-0">⚫ pistoia, italy</p>
            </div>
            <nav class="header-nav text-uppercase d-flex gap-3">
                <a href="mailto:kevin.cooray98@gmail.com" class="social-link" style="color: #1a1a1a;">mail</a>
                <span class="nav-separator">/</span>
                <a href="https://github.com/kevdesign98" class="social-link" target="_blank"
                    style="color: #1a1a1a;">github</a>
                <span class="nav-separator">/</span>
                <a href="https://www.linkedin.com/in/kevin-cooray-frontend-dev/" class="social-link" target="_blank"
                    style="color: #1a1a1a;">linkedin</a>
            </nav>
        </header>

        <div class="row w-100">
            <div class="col-12 text-center">
                <h1 class="hero-name text-uppercase" id="name-container">kevin cooray</h1>
            </div>
        </div>

        <div class="row w-100 justify-content-center align-items-center my-4">
            <div class="interaction-nav">
                <a href="webgl.html" id="trigger-visual" class="nav-link">
                    <span class="nav-text">A Frontend</span>
                </a>

                <div id="display-frame" class="display-box">
                    <img id="active-media" src="" alt="">
                </div>

                <a href="https://kevdesign98.github.io/portfolio-html/home.html" id="trigger-designer" class="nav-link">
                    <span class="nav-text">Developer</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="fixed-bottom px-4 px-md-5 py-4 d-flex justify-content-between align-items-center">
        <div class="footer-left">
            <p class="m-0">© 2026 KEVIN COORAY</p>
        </div>
        <div class="footer-right">
            <p class="m-0 text-uppercase">BASED IN PISTOIA, ITALY</p>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const title = document.querySelector('.hero-name');
            const words = title.innerText.split(' ');

            // Crea la struttura: Parola > Lettera > (Originale + Clone)
            title.innerHTML = words.map(word => `
        <span class="word">
            ${word.split('').map(char => `
                <div class="char-wrapper">
                    <div class="char-inner">
                        <span class="original">${char}</span>
                        <span class="clone">${char}</span>
                    </div>
                </div>
            `).join('')}
        </span>
    `).join('');

            // Animazione GSAP - Scivola verticalmente per mostrare il clone
            document.querySelectorAll('.char-wrapper').forEach(char => {
                char.addEventListener('mouseenter', () => {
                    gsap.to(char.querySelector('.char-inner'), {
                        yPercent: -50, // Scivola verso l'alto del 50% della sua altezza totale (2em -> 1em) per mostrare il clone
                        duration: 0.4,
                        ease: "power3.out"
                    });
                });

                char.addEventListener('mouseleave', () => {
                    gsap.to(char.querySelector('.char-inner'), {
                        yPercent: 0, // Ritorna alla posizione originale
                        duration: 0.4,
                        ease: "power3.out"
                    });
                });
            });
        });

        const displayBox = document.querySelector('.display-box');
        const activeMedia = document.getElementById('active-media');
        const triggers = document.querySelectorAll('.nav-link');

        // Mappa delle immagini corrispondenti ai trigger
        const mediaMap = {
            'trigger-visual': 'assets/imgs/room.png',
            'trigger-designer': 'assets/imgs/test-image.png'
        };

        triggers.forEach(trigger => {
            trigger.addEventListener('mouseenter', () => {
                const id = trigger.id;
                if (mediaMap[id]) {
                    activeMedia.src = mediaMap[id];
                    activeMedia.alt = trigger.textContent.trim();
                }
                gsap.to(displayBox, {
                    opacity: 1,
                    y: 0,
                    duration: 0.6,
                    ease: "power4.out"
                });
            });

            trigger.addEventListener('mouseleave', () => {
                gsap.to(displayBox, {
                    opacity: 0,
                    y: 15,
                    duration: 0.4
                });
            });
        });


        // Simulazione progresso o tracking reale
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        function updateLoader() {
            progress += Math.random() * 10; // Incremento casuale
            if (progress > 100) progress = 100;

            progressBar.style.width = progress + "%";
            progressText.innerText = Math.floor(progress) + "%";

            if (progress < 100) {
                requestAnimationFrame(updateLoader);
            } else {
                finishLoader();
            }
        }

        function finishLoader() {
            gsap.to("#loader-wrapper", {
                y: "-100%", // La transizione verso l'alto
                duration: 1.2,
                ease: "power4.inOut",
                onComplete: () => {
                    document.getElementById('loader-wrapper').style.display = 'none';
                    // Qui parte l'animazione della Hero Section
                    animateHero();
                }
            });
        }

        function animateHero() {
            // Animazione di ingresso della tua Hero
            gsap.from(".hero-name", { opacity: 0, y: 50, duration: 1 });
        }

        updateLoader();
    </script>

</body>

</html>
